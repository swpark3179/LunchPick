[package]
name = "lunchpick"
version = "1.1.1"
description = "LunchPick desktop app"
authors = ["s-w.park"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lunchpick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
# native-tls: Windows cert store (schannel). Trusts private/corporate root CAs.
# 프록시는 쓰지 않는다 — fabrix.rs 의 클라이언트가 no_proxy() 로 항상 DIRECT 연결한다.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
# 같이 고르기: 사내망 WebSocket 서버/접속 (TLS 없음 — 같은 망 안에서만 쓴다)
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
# share.rs 통합 테스트에서 MockRuntime 으로 실제 소켓을 열어 본다.
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
